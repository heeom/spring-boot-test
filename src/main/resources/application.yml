spring:
  application:
    name: spring-boot-test

  datasource:
    url: jdbc:mysql://localhost:3306/test
    username: root
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
    org.springframework.transaction.interceptor: trace
  pattern:
    correlation: "TRACE_ID[%X{traceId:-}]SPAN_ID[%X{spanId:-}] "

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3


